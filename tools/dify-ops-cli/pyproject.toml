[project]
name = "dify-ops-cli"
version = "0.1.0"
description = "CLI tool for Dify platform operations"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-cov>=4.1.0",
    "basedpyright>=1.31.0",
    "ruff>=0.14.0",
]

[project.scripts]
dify-ops = "dify_ops_cli.cli:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.2",
    "pytest-cov>=4.1.0",
    "basedpyright>=1.31.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=dify_ops_cli --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
